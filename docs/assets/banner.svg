<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="August — Laya decides, the LLM writes, the sandbox executes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14231f"/>
      <stop offset="1" stop-color="#2f5d50"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c56b"/>
      <stop offset="1" stop-color="#e0864a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <circle cx="1060" cy="260" r="100" fill="url(#sun)" opacity="0.95"/>
  <g stroke="#14231f" stroke-width="10" opacity="0.55">
    <line x1="950" y1="262" x2="1170" y2="262"/>
    <line x1="960" y1="294" x2="1160" y2="294"/>
    <line x1="980" y1="326" x2="1140" y2="326"/>
  </g>
  <text x="80" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="112" fill="#f6f3ec" letter-spacing="2">August</text>
  <text x="84" y="228" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="30" fill="#cfe3db">Laya решает · LLM пишет · песочница исполняет</text>
  <text x="84" y="282" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#9fc2b5">Локальный AI-агент, который сам находит инструменты</text>
  <text x="84" y="314" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" fill="#9fc2b5">и не делает ничего опасного без вас</text>
</svg>
