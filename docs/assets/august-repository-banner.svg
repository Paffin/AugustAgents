      <text x="1008" y="323" text-anchor="middle">Workflow</text>
      <rect x="983" y="352" width="168" height="43" rx="7" fill="#f9fbff"/>
      <text x="1067" y="380" text-anchor="middle">Рефлекс</text>
    </g>
    <g fill="none" stroke="#d9e4f3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M986 201H1037V243M1029 235L1037 243L1045 235"/>
